name: ⏰ Keep Supabase awake

# Free-plan projects are paused after 7 days without API activity.
# A single REST query every other day is enough to keep them active.
on:
    schedule:
        - cron: "17 6 */2 * *"
    workflow_dispatch:

# Outbound curl only: the job needs no access to the repository.
permissions: {}

jobs:
    ping:
        name: ⏰ Ping the REST API
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
            SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
            SB_PUBLISHABLE_KEY: ${{ secrets.SB_PUBLISHABLE_KEY }}
        steps:
            - if: ${{ !env.SUPABASE_URL || !env.SB_PUBLISHABLE_KEY }}
              name: ⚠️ Check Supabase secrets
              run: echo ':warning:SUPABASE_URL or SB_PUBLISHABLE_KEY secret is missing, skipping the ping' >> $GITHUB_STEP_SUMMARY

            - if: ${{ env.SUPABASE_URL && env.SB_PUBLISHABLE_KEY }}
              name: 📡 Query the database
              # RLS restricts these tables to authenticated users, so the
              # anonymous key gets an empty array back — the query still runs
              # on Postgres, which is what counts as activity.
              run: |
                  curl --fail-with-body --silent --show-error \
                    --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
                    "$SUPABASE_URL/rest/v1/companies?select=id&limit=1" \
                    -H "apikey: $SB_PUBLISHABLE_KEY" \
                    -H "Authorization: Bearer $SB_PUBLISHABLE_KEY"
